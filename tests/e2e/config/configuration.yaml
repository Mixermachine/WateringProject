# Committed skeleton. Home Assistant writes .storage/ and a database next to it;
# both are gitignored.
default_config:

# Deliberately no `lovelace:` block: the sidebar tab and the card module come from
# the integration's own panel registration, so this config is what a fresh install
# looks like. If the panel registration regresses, every e2e scenario fails.

logger:
  default: warning
  logs:
    custom_components.watering_project: debug
    custom_components.fake_plants: debug

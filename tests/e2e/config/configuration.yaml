# Committed skeleton. Home Assistant writes .storage/ and a database next to it;
# both are gitignored.
default_config:

lovelace:
  mode: yaml
  resources:
    - url: /watering_project/watering-project-card.js?v=0.1.0
      type: module
  dashboards:
    watering-project:
      mode: yaml
      title: Watering Project
      icon: mdi:sprout
      show_in_sidebar: true
      filename: watering-dashboard.yaml

logger:
  default: warning
  logs:
    custom_components.watering_project: debug
    custom_components.fake_plants: debug

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  pytest:
    name: pytest (HA 2026.10 / Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build pinned test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/test.Dockerfile
          tags: watering-project-tests:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run pytest
        run: docker run --rm -v "$PWD:/work" -w /work watering-project-tests pytest
      - name: Package the integration (HAOS zip)
        run: python scripts/package_integration.py
      - name: Ruff
        run: |
          python -m pip install -r requirements_dev.txt
          ruff check custom_components tests dev scripts
          ruff format --check custom_components tests dev scripts

  card:
    name: card (Vitest + build drift)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: Bundle must match the committed build output
        run: |
          npm run build
          cd ..
          git diff --exit-code -- custom_components/watering_project/www

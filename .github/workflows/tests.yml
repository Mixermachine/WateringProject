name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  pytest:
    name: pytest (HA 2026.10 / Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build pinned test image
        run: docker build -f docker/test.Dockerfile -t watering-project-tests .
      - name: Run pytest
        run: docker run --rm -v "$PWD:/work" -w /work watering-project-tests pytest
      - name: Ruff
        run: |
          python -m pip install ruff
          ruff check custom_components tests dev
          ruff format --check custom_components tests dev

  card:
    name: card (Vitest + build drift)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: Bundle must match the committed build output
        run: |
          npm run build
          cd ..
          git diff --exit-code -- custom_components/watering_project/www
